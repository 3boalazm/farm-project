<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <!-- Performance hints -->
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://farm-mz99-default-rtdb.europe-west1.firebasedatabase.app" crossorigin>
  <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
  <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f3f4f6" media="(prefers-color-scheme: light)">

<script>(function(){var t=localStorage.getItem('farm_theme');if(t==='light')document.documentElement.classList.add('light-mode');}());</script>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>سجل النشاط — بيان المزرعة</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Lexend:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="media/logo-icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="media/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="media/favicon-16.png">
<link rel="apple-touch-icon" href="media/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="page-wrap rail-v2-content">
  <div id="page-header"></div>
  <div id="content"><div class="text-center py-5"><div class="spinner"></div></div></div>
  <footer class="text-center text-gray mt-5 pt-4 pb-3" style="border-top:1px solid var(--border)">
    © <span id="footer-year"></span> <span id="footer-farm"></span><br>
    <small style="font-size:.72rem;color:var(--text-muted)">إشراف: لواء أحمد رجب نوح &nbsp;|&nbsp; تطوير: جندي مصطفى محمد إبراهيم</small>
  </footer>
</div>
<script src="config.js"></script>
<script src="firebase.js"></script>
<script src="nav.js"></script>
<script src="shared.js"></script>
<script src="offline-sync.js" defer></script>
<script src="pages/tour.js" defer></script>
<script>
'use strict';
const ACTION_CFG={
  add:    {label:'إضافة',        icon:'bi-plus-circle-fill',   color:'var(--green)'},
  edit:   {label:'تعديل',        icon:'bi-pencil-fill',        color:'var(--blue)'},
  delete: {label:'حذف',          icon:'bi-trash-fill',         color:'var(--red)'},
  remove: {label:'حذف',          icon:'bi-trash-fill',         color:'var(--red)'},
  export: {label:'تصدير',        icon:'bi-download',           color:'var(--yellow)'},
  login:  {label:'تسجيل دخول',   icon:'bi-box-arrow-in-right', color:'var(--green)'},
  logout: {label:'تسجيل خروج',   icon:'bi-box-arrow-left',     color:'var(--gray)'},
};
let allLogs=[], fAction='all', fRole='all';

document.addEventListener('DOMContentLoaded', async ()=>{
  if(!requireAuth())return;
  initFirebase();
  const s=getSettings();
  document.getElementById('footer-year').textContent=ar(new Date().getFullYear());
  document.getElementById('footer-farm').textContent=s.farmName;
  renderNavbarV2('activity.html');

  if(!can('admin')){
    document.getElementById('content').innerHTML=
      '<div class="empty-state"><i class="bi bi-shield-lock-fill"></i><p>هذه الصفحة للمدير فقط</p></div>';
    renderPageHeader('<i class="bi bi-clock-history accent-text"></i> سجل النشاط','','');
    return;
  }

  renderPageHeader(
    '<i class="bi bi-clock-history accent-text"></i> سجل النشاط',
    'كل الإضافات والتعديلات والحذف اللي حصلت في النظام',
    '<button class="action-btn primary" onclick="loadActivity()"><i class="bi bi-arrow-clockwise"></i> تحديث</button>'
  );

  await loadActivity();
});

async function loadActivity(){
  const el=document.getElementById('content');
  renderLoading(el);
  try{
    allLogs=await fbGet('activity_log',true);
    allLogs.sort((a,b)=>new Date(b.timestamp||0)-new Date(a.timestamp||0));
  }catch(e){
    el.innerHTML='<div class="empty-state"><i class="bi bi-wifi-off"></i><p>تعذر الاتصال بقاعدة البيانات</p><small class="text-gray">'+e.message+'</small></div>';
    return;
  }
  renderActivityPage();
}

function renderActivityPage(){
  const el=document.getElementById('content');
  const today=todayStr();
  const todays=allLogs.filter(l=>l.date===today);
  const users=[...new Set(allLogs.map(l=>l.userName).filter(Boolean))];
  const actions=[...new Set(allLogs.map(l=>l.action).filter(Boolean))];
  const filtered=allLogs
    .filter(l=>fAction==='all'||l.action===fAction)
    .filter(l=>fRole==='all'||l.userRole===fRole)
    .slice(0,300);

  el.innerHTML=
  '<div class="row g-3 mb-4">'+
    [['إجمالي العمليات',ar(allLogs.length),'var(--orange)','bi-list-check'],
     ['اليوم',ar(todays.length),'var(--blue)','bi-calendar-day-fill'],
     ['مستخدمون نشطون',ar(users.length),'var(--green)','bi-people-fill']]
    .map(s=>'<div class="col-6 col-md-4"><div class="stat-mini"><i class="bi '+s[3]+' d-block mb-1" style="color:'+s[2]+';font-size:1.2rem"></i><div class="num" style="color:'+s[2]+'">'+s[1]+'</div><div class="lbl">'+s[0]+'</div></div></div>').join('')+
  '</div>'+
  '<div class="d-flex gap-2 flex-wrap mb-4">'+
    '<button class="filter-btn'+(fAction==='all'?' active':'')+'" onclick="fAction=\'all\';renderActivityPage()">كل العمليات</button>'+
    actions.map(a=>'<button class="filter-btn'+(fAction===a?' active':'')+'" onclick="fAction=\''+a+'\';renderActivityPage()">'+(ACTION_CFG[a]?.label||a)+'</button>').join('')+
    '<select class="field" style="width:auto;display:inline-block" onchange="fRole=this.value;renderActivityPage()">'+
      '<option value="all">كل الأدوار</option>'+
      Object.keys(ROLES).map(r=>'<option value="'+r+'"'+(fRole===r?' selected':'')+'>'+ROLES[r].label+'</option>').join('')+
    '</select>'+
  '</div>'+
  (filtered.length===0?'<div class="empty-state"><i class="bi bi-clock-history"></i><p>لا يوجد نشاط مسجل</p></div>':
  filtered.map(l=>{
    const cfg=ACTION_CFG[l.action]||{label:l.action||'—',icon:'bi-dot',color:'var(--gray)'};
    const role=ROLES[l.userRole];
    return '<div class="notif-item">'+
      '<div class="d-flex gap-3 align-items-start">'+
        '<div style="width:38px;height:38px;border-radius:50%;background:'+cfg.color+'22;display:flex;align-items:center;justify-content:center;flex-shrink:0">'+
          '<i class="bi '+cfg.icon+'" style="color:'+cfg.color+'"></i>'+
        '</div>'+
        '<div class="flex-grow-1">'+
          '<div class="d-flex justify-content-between align-items-start gap-2">'+
            '<div class="fw-bold" style="font-size:.86rem;color:'+cfg.color+'">'+cfg.label+(l.resource?' — '+l.resource:'')+'</div>'+
            (role?'<span class="type-badge" style="background:'+role.color+'22;color:'+role.color+';border:1px solid '+role.color+'44;font-size:.68rem"><i class="bi '+role.icon+' me-1"></i>'+role.label+'</span>':'')+
          '</div>'+
          '<div class="text-gray" style="font-size:.8rem;margin-top:2px">'+escapeHtml(l.description||'—')+'</div>'+
          '<div style="font-size:.7rem;color:var(--text-muted);margin-top:3px"><i class="bi bi-person me-1"></i>'+escapeHtml(l.userName||'—')+
            ' &nbsp;<i class="bi bi-clock me-1"></i>'+(l.timestamp?l.timestamp.replace('T',' ').slice(0,16):(l.date||'—'))+'</div>'+
        '</div>'+
      '</div>'+
    '</div>';
  }).join(''))+
  (allLogs.length>filtered.length&&filtered.length===300?'<div class="text-center text-gray mt-3" style="font-size:.8rem">مُعروض أحدث ٣٠٠ عملية فقط</div>':'');
}
</script>
</body>
</html>
