<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <!-- Performance hints -->
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://farm-mz99-default-rtdb.europe-west1.firebasedatabase.app" crossorigin>
  <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
  <link rel="dns-prefetch" href="https://aistudio.googleapis.com">
  <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f3f4f6" media="(prefers-color-scheme: light)">

<script>(function(){var d=document.documentElement;try{var t=localStorage.getItem('farm_theme');if(t==='light'){d.classList.add('light-mode');d.setAttribute('data-theme','light');}else if(t==='auto'){d.removeAttribute('data-theme');}else{d.setAttribute('data-theme','dark');}var n=localStorage.getItem('farm_density');if(n)d.setAttribute('data-density',n);var c=localStorage.getItem('farm_contrast');if(c==='high')d.setAttribute('data-contrast','high');var m=localStorage.getItem('farm_motion');if(m==='off')d.setAttribute('data-motion','off');}catch(e){}})();</script>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تسجيل الدخول</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Lexend:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="media/logo-icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="media/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="media/favicon-16.png">
<link rel="apple-touch-icon" href="media/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="ui.css">
</head>
<body>
<div class="login-screen">
  <div class="login-card" id="login-card">
    <div class="login-logo" aria-hidden="true">🐐</div>
    <h3 class="fw-bold mb-1" id="farm-name-title">بيان المزرعة</h3>
    <p class="text-gray mb-3" id="login-subtitle" style="font-size:.85rem">اختر المستخدم وأدخل رمز PIN</p>

    <!-- الدور هنا مُرشِّح للقائمة فقط، لا هوية: الهوية هي المستخدم نفسه.
         (قبل إعادة التصميم كانت الأدوار هي المدخل، فكان التحقق يمرّ على كل
         سجلات الدور بحثًا عن تطابق PIN — وهو ما يجبر الصفحة على قراءة جدول
         المستخدمين كاملًا بما فيه من hashes. الآن القائمة تأتي من الإسقاط
         العام user_directory، والتحقق يتم على Firebase Auth.) -->
    <div class="role-filter" id="role-btns" role="group" aria-label="تصفية حسب الدور"></div>

    <div class="user-picker" id="user-picker" role="group" aria-label="اختر المستخدم"></div>

    <div class="pin-display mb-3" id="pin-display" aria-live="polite">____</div>
    <div class="row g-2" id="pin-pad" dir="ltr"></div>

    <!-- رسالة إعداد قابلة للتنفيذ: تظهر فقط عندما ترفض القواعد القراءة
         (تم نشر القواعد المشدّدة) ولم يُفعّل Email/Password بعد، أو عندما
         لا توجد قائمة مستخدمين أصلًا. لا تظهر أبدًا كخطأ عام غامض. -->
    <div class="setup-notice" id="setup-notice" role="status" hidden></div>
  </div>
  <div class="login-hint"><i class="bi bi-keyboard me-1"></i>يمكن الكتابة بالكيبورد | Tab للتنقل بين الأدوار | Enter للتأكيد</div>
</div>
<div id="toast-wrap"></div>
<script src="config.js"></script>
<script src="firebase.js"></script>
<script src="ui-shell.js"></script>
<!-- O-09: the offline/PWA registrar. Loaded on every page; registration
     itself is gated on FARM_CONFIG.enableServiceWorker in config.js. -->
<script src="sw-register.js" defer></script>
<script>
;(async()=>{
  await Users.init();
  const s=getSettings();
  document.getElementById('farm-name-title').textContent=s.farmName;

  let lRole='', lPin='', lUserId='', DIRECTORY=[], FIRST_RUN=false, READ_DENIED=false, BUSY=false;
  const $=(id)=>document.getElementById(id);

  // ── load the identity list (public projection, no hashes) ──────────
  async function loadDirectory(){
    const dir=await fbGetSafe('user_directory');
    const legacy=await fbGetSafe('users');
    if(Array.isArray(dir)&&dir.length){
      DIRECTORY=dir.map(publicUserProjection).filter(Boolean);
    }else if(Array.isArray(legacy)&&legacy.length){
      DIRECTORY=legacy.map(publicUserProjection).filter(Boolean);
    }else{
      DIRECTORY=[];
    }
    // A genuinely EMPTY users collection (not a failed read) is the only
    // situation where the first-run bootstrap credential is honoured.
    FIRST_RUN=(dir===null||!dir.length)&&Array.isArray(legacy)&&legacy.length===0;
    READ_DENIED=(legacy===null)&&(dir===null||!dir.length);
  }
  await loadDirectory();

  // ── role filter ───────────────────────────────────────────────────
  function renderRoles(){
    const counts={};
    DIRECTORY.forEach(u=>{ if(u.active!==false) counts[u.role]=(counts[u.role]||0)+1; });
    const roles=Object.keys(ROLES).filter(k=>counts[k]);
    $('role-btns').innerHTML=(roles.length>1?roles:['']).map(k=>k?`
      <button type="button" class="role-chip${lRole===k?' is-on':''}" data-role="${k}" aria-pressed="${lRole===k}">
        <i class="bi ${ROLES[k].icon}" style="color:${ROLES[k].color}"></i> ${ROLES[k].label}
        <span class="role-chip__n">${counts[k]}</span>
      </button>`:`
      <button type="button" class="role-chip${lRole===''?' is-on':''}" data-role="" aria-pressed="${lRole===''}">
        <i class="bi bi-people"></i> الكل <span class="role-chip__n">${DIRECTORY.filter(u=>u.active!==false).length}</span>
      </button>`).join('');
    $('role-btns').querySelectorAll('.role-chip').forEach(b=>{
      b.addEventListener('click',()=>{ selectRole(b.dataset.role); });
    });
  }

  // ── user picker ───────────────────────────────────────────────────
  function visibleUsers(){
    return DIRECTORY.filter(u=>u.active!==false && (!lRole || u.role===lRole));
  }
  function renderUsers(){
    const list=visibleUsers();
    if(FIRST_RUN && !list.length){
      $('user-picker').innerHTML=`
        <button type="button" class="user-chip is-on" data-id="admin1" aria-pressed="true">
          <span class="user-chip__avatar">👤</span>
          <span class="user-chip__body"><strong>مدير المزرعة</strong><small>تهيئة أولى — الرمز 1234</small></span>
        </button>`;
      lUserId='admin1';
    }else{
      $('user-picker').innerHTML=list.map(u=>`
        <button type="button" class="user-chip${lUserId===u.id?' is-on':''}" data-id="${u.id}" aria-pressed="${lUserId===u.id}">
          <span class="user-chip__avatar">${u.initials||'👤'}</span>
          <span class="user-chip__body">
            <strong>${escapeHtml(u.name||u.id)}</strong>
            <small><i class="bi ${ROLES[u.role]?ROLES[u.role].icon:'bi-person'}"></i> ${ROLES[u.role]?ROLES[u.role].label:(u.role||'')}</small>
          </span>
        </button>`).join('');
      // One obvious candidate? Pick it, so a worker never has to tap twice.
      if(!lUserId && list.length===1) lUserId=list[0].id;
    }
    $('user-picker').querySelectorAll('.user-chip').forEach(b=>{
      b.addEventListener('click',()=>{ selectUser(b.dataset.id); });
    });
    if(lUserId) markSelected();
    updateHint();
  }
  function markSelected(){
    $('user-picker').querySelectorAll('.user-chip').forEach(b=>{
      const on=b.dataset.id===lUserId;
      b.classList.toggle('is-on',on); b.setAttribute('aria-pressed',String(on));
    });
  }
  function updateHint(){
    const u=DIRECTORY.find(x=>x.id===lUserId);
    $('login-subtitle').textContent = u
      ? 'مرحبًا '+u.name+' — أدخل رمز PIN'
      : (FIRST_RUN ? 'تهيئة المزرعة — أنشئ حساب المدير بالرمز 1234' : 'اختر المستخدم وأدخل رمز PIN');
    $('pin-display').textContent='____';
  }
  function showNotice(html){ const n=$('setup-notice'); n.innerHTML=html; n.hidden=false; }
  function hideNotice(){ const n=$('setup-notice'); n.hidden=true; n.innerHTML=''; }

  window.selectRole=function(role){
    lRole=role||''; lUserId=''; lPin=''; hideNotice();
    renderRoles(); renderUsers();
  };
  window.selectUser=function(id){
    lUserId=id; lPin=''; hideNotice(); markSelected(); updateHint();
  };

  // ── PIN pad ───────────────────────────────────────────────────────
  $('pin-pad').innerHTML=[1,2,3,4,5,6,7,8,9,'⌫',0,'✓'].map(k=>`
    <div class="col-4"><button type="button" class="pin-btn" data-key="${k}">${k}</button></div>`).join('');
  $('pin-pad').querySelectorAll('.pin-btn').forEach(b=>{
    b.addEventListener('click',()=>window.pinPress(b.dataset.key));
  });

  window.pinPress=function(k){
    if(BUSY) return;
    const disp=$('pin-display');
    if(k==='⌫'){ lPin=lPin.slice(0,-1); }
    else if(k==='✓'){ attemptLogin(); return; }
    else if(lPin.length<8){ lPin+=k; }
    disp.textContent=lPin?'•'.repeat(lPin.length)+'_'.repeat(Math.max(0,4-lPin.length)):'____';
    if(lPin.length>=4) attemptLogin();
  };

  function fail(message){
    const disp=$('pin-display');
    disp.textContent=message||'خطأ!'; disp.classList.add('is-error');
    lPin=''; BUSY=false;
    setTimeout(()=>{ disp.textContent='____'; disp.classList.remove('is-error'); },1600);
  }

  // ── the login itself ──────────────────────────────────────────────
  // Order matters. Firebase Auth is asked FIRST because it is the only
  // verifier that does not require this page to read a stored hash — and
  // reading hashes is exactly what the hardened rules (O-18) forbid. The
  // legacy hash path is a migration fallback that only runs when Firebase
  // cannot answer at all: provider not enabled yet, account not provisioned
  // yet, or no network. A WRONG PIN against a provisioned account is a
  // real failure and never falls through.
  async function attemptLogin(){
    if(BUSY) return;
    if(!lUserId){ fail('اختر مستخدمًا'); return; }
    if(lPin.length<4) return;
    BUSY=true;
    const disp=$('pin-display'); disp.textContent='••••'; hideNotice();

    const profile=DIRECTORY.find(u=>u.id===lUserId)||{id:lUserId,role:lRole||'admin',name:lUserId};
    let user=null, verifiedBy=null;

    // The user's OWN record. Under the hardened rules a signed-in bridge
    // identity may read exactly this one record (and an admin may read any),
    // so this succeeds for the person logging in and is denied for an
    // anonymous visitor — which is the whole point of O-18.
    let rec=null;
    try{ rec=await fbGetOne('users', lUserId); }catch(e){ rec=null; }

    // 1 · Firebase Auth — verified on Firebase's own servers, no hash read.
    let bridge=null;
    try{ bridge=await signInBestSlot(lUserId, lPin, rec); }catch(e){ bridge=null; }

    if(bridge&&bridge.ok){
      verifiedBy='firebase-auth';
      user={...(rec||profile), active:true};
    }else{
      const reason=bridge?bridge.reason:'network';
      // Firebase knows this account and rejects the PIN, and we cannot read
      // the record to double-check it: that is simply a wrong PIN.
      if(reason==='invalid-credentials' && !rec){ BUSY=false; return fail('رمز غير صحيح'); }

      // 2 · Stored-hash verification. Reached when (a) the Email/Password
      //    provider is not enabled yet, (b) no slot has been provisioned for
      //    this user yet, (c) there is no network to Firebase Auth, or
      //    (d) Firebase rejected a PIN the hash says is correct — an admin
      //    rotated it after the slot was created. Provisioning a fresh slot
      //    below is what self-heals case (d).
      const v = rec ? await verifyPinAgainstRecord(rec, lPin) : null;
      if(v && v.ok){
        verifiedBy='pin-hash:'+v.scheme;
        user={...rec, active:rec.active!==false};
        if(v.scheme!=='v2'){
          const v2=await hashPinV2(lPin, lUserId);
          if(v2){
            try{ await fbPut('pin_vault', lUserId, {pin_hash_v2:v2}); }catch(e){}
            try{ await fbPatch('users', lUserId, {pin_hash_v2:v2, pin:null}); }catch(e){}
            user.pin_hash_v2=v2; delete user.pin;
          }
        }
        try{ await provisionAuthSlot(lUserId, lPin, rec); }catch(e){}
      }else if(FIRST_RUN && lPin==='1234' && (!lRole || lRole==='admin')){
        // A genuinely EMPTY database (fbGetSafe distinguished "empty" from
        // "failed") is the only case where the factory credential is honoured.
        user={id:'admin1',name:'مدير المزرعة',role:'admin',active:true,created:todayStr()};
        verifiedBy='first-run';
        try{ await signInWithFirebaseAuth('admin1','1234',{provision:true}); }catch(e){}
      }else if(!rec && (READ_DENIED||isPermissionDenied())){
        BUSY=false;
        showNotice(
          '<strong><i class="bi bi-shield-lock me-1"></i>يلزم إجراء إعداد واحد</strong>'+
          '<p class="mb-1">قواعد الأمان الجديدة تمنع المتصفح من قراءة رموز الدخول (وهذا مقصود)، '+
          'وتسجيل الدخول أصبح يتم عبر Firebase Authentication.</p>'+
          '<ol class="mb-1"><li>افتح Firebase Console ‏→ Authentication ‏→ Sign-in method</li>'+
          '<li>فعّل <b>Email/Password</b></li>'+
          '<li>ثم نفّذ <code>firebase deploy --only database</code></li></ol>'+
          '<p class="mb-0 small">الترتيب مهم: فعّل المزوّد أولًا، ثم انشر القواعد.</p>');
        return fail('إعداد مطلوب');
      }else{
        BUSY=false; return fail('رمز غير صحيح');
      }
    }

    if(!user){ BUSY=false; return fail('رمز غير صحيح'); }

    setUser({...user, verifiedBy});
    try{ await syncUserDirectory(user); }catch(e){}
    // Audit + login notification.
    // BUG FIX (2026-10 audit): this block posted the SAME login event to
    // activity_log TWICE -- once here, once again at the end of the
    // throttled-notification block below it -- so every single login
    // produced two identical audit rows and doubled the audit trail's
    // growth rate for no reason (activity.html counts "إجمالي العمليات"
    // straight off that collection). One write now, keeping the more
    // descriptive of the two messages; the 5-minute login-notification
    // throttle is unchanged.
    if(initFirebase()){
      try{
        const _lastLoginKey='_last_login_log_'+user.id;
        const _lastT=+localStorage.getItem(_lastLoginKey)||0;
        const _now=Date.now();
        if(_now-_lastT>300000){  // 5 minutes
          localStorage.setItem(_lastLoginKey,_now);
          await fbPost('login_notifications',{
            userName:user.name, userRole:user.role,
            roleLabel:ROLES[user.role]?.label||user.role,
            timestamp:new Date().toISOString(),
            date:todayStr(),
            pushed:false
          });
        }  // end throttle check
        await fbPost('activity_log',{
          userId:user.id, userName:user.name, userRole:user.role,
          action:'login', resource:'system',
          description:'تسجيل دخول — '+user.name+' ('+(ROLES[user.role]?.label||user.role)+')',
          date:todayStr(),
          timestamp:new Date().toISOString()
        });
      }catch(e){console.warn('login log:',e);}
    }
    window.location.href='dashboard.html';
    BUSY=false;
  }

  renderRoles(); renderUsers();

  // ✅ دعم الكيبورد (PC + موبايل بلوتوث كيبورد)
  document.addEventListener('keydown',function(e){
    if(e.key>='0'&&e.key<='9'){window.pinPress(e.key);}
    else if(e.key==='Backspace'||e.key==='Delete'){window.pinPress('⌫');}
    else if(e.key==='Enter'){window.pinPress('✓');}
    else if(e.key==='ArrowLeft'||e.key==='Tab'){
      const roles=[''].concat(Object.keys(ROLES)).filter(k=>!k||DIRECTORY.some(u=>u.role===k&&u.active!==false));
      if(roles.length>1){
        const idx=roles.indexOf(lRole);
        window.selectRole(roles[(idx+1)%roles.length]);
      }
      e.preventDefault();
    }else if(e.key==='ArrowUp'||e.key==='ArrowDown'){
      const list=visibleUsers();
      if(list.length>1){
        const idx=list.findIndex(u=>u.id===lUserId);
        const next=list[(idx+(e.key==='ArrowDown'?1:-1)+list.length*2)%list.length];
        window.selectUser(next.id);
      }
      e.preventDefault();
    }
  });

  // Register logout activity before leaving
  window.addEventListener('beforeunload',()=>{
    const u=getUser();
    if(u&&initFirebase()){
      const data={userId:u.id,userName:u.name,userRole:u.role,action:'logout',resource:'system',description:'تسجيل خروج',date:todayStr(),timestamp:new Date().toISOString(),created_at:new Date().toISOString()};
      navigator.sendBeacon(`${FB_URL}/activity_log.json`,JSON.stringify(data));
    }
  });
})();
</script>
</body>
</html>
