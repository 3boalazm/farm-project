<html lang="ar" dir="rtl">

<script>(function(){var d=document.documentElement;try{var t=localStorage.getItem('farm_theme');if(t==='light'){d.classList.add('light-mode');d.setAttribute('data-theme','light');}else if(t==='auto'){d.removeAttribute('data-theme');}else{d.setAttribute('data-theme','dark');}var n=localStorage.getItem('farm_density');if(n)d.setAttribute('data-density',n);var c=localStorage.getItem('farm_contrast');if(c==='high')d.setAttribute('data-contrast','high');var m=localStorage.getItem('farm_motion');if(m==='off')d.setAttribute('data-motion','off');}catch(e){}})();</script>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تسجيل الدخول — بيان المزرعة</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Lexend:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="media/logo-icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="media/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="media/favicon-16.png">
<link rel="apple-touch-icon" href="media/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="ui.css">
</head>
<body>
<!-- ════════════════════════════════════════════════════════════════════
     شاشة الدخول — identifier-first، عمود واحد، ولا قائمة مستخدمين.

     لماذا لا تظهر أسماء المستخدمين هنا (قرار ٢٠٢٦/١٠، طلب المالك):
     الشاشة التي قبل تسجيل الدخول هي أكثر سطح معرَّض للعامة في التطبيق
     كله — تابلت معلّق في المزرعة، هاتف مسروق، كتف شخص واقف خلفك.
     عرض القائمة يكشف هوية كل من يعمل هنا ودوره، ويحوّل صفحة الدخول إلى
     أداة تعداد (username enumeration): يكفي أن تجرب الأسماء لتعرف أيها
     له حساب. القاعدة المطبّقة هنا هي نفسها سياسة
     "Interactive logon: Don't display username at sign-in" ونصيحة Carbon
     Design System: لا تُظهر أي تفصيلة هوية قبل التحقق، واجعل الرد واحدًا
     للحساب الموجود وغير الموجود.

     لذلك: حقل «كود الدخول» يكتبه المستخدم نفسه (اسم أو كود، بلا
     autocomplete لقائمة)، ولوحة أرقام ٣×٤ كأي هاتف/نقطة بيع، ورسالة خطأ
     واحدة محايدة لكل الحالات، وتأخير موحّد حتى لا يفضح التوقيت وجود
     الحساب. القراءة من user_directory ما زالت تحدث — لكن للمطابقة فقط،
     ولا يُرسم منها حرف واحد على الشاشة.
     ════════════════════════════════════════════════════════════════════ -->
<div class="login-screen">
  <main class="login-card" id="login-card">
    <header class="login-brand">
      <span class="login-logo" aria-hidden="true">🐐</span>
      <h1 class="login-title" id="farm-name-title">بيان المزرعة</h1>
      <p class="login-sub" id="login-subtitle">أدخل كود الدخول ثم الرمز المكوّن من ٤ أرقام</p>
    </header>

    <form id="login-form" novalidate>
      <!-- 1 · Identifier: typed, never listed. autocomplete=username so a
             password manager can fill it, but there is no datalist and no
             suggestion — the page never reveals a single name. -->
      <div class="login-field">
        <label class="login-label" for="login-id">كود الدخول</label>
        <div class="login-input-wrap">
          <i class="bi bi-person-badge login-input-icon" aria-hidden="true"></i>
          <input class="login-input" id="login-id" name="login-id" type="text"
                 dir="auto" autocomplete="username" autocapitalize="off"
                 autocorrect="off" spellcheck="false" maxlength="48"
                 placeholder="الاسم أو الكود" aria-describedby="login-id-help">
        </div>
        <p class="login-help" id="login-id-help">يُكتب ولا يُعرض: لا تظهر أسماء المستخدمين على هذه الشاشة حمايةً للخصوصية.</p>
      </div>

      <!-- 2 · PIN: masked dots + an sr-only live region so a screen reader
             user knows how many digits are in without the digits being
             spoken aloud (shoulder-surfing applies to audio too). -->
      <div class="pin-block" id="pin-block">
        <span class="pin-label" id="pin-label">رمز الدخول</span>
        <div class="pin-dots" id="pin-dots" dir="ltr" role="img" aria-labelledby="pin-label">
          <span class="pin-dot"></span><span class="pin-dot"></span><span class="pin-dot"></span><span class="pin-dot"></span>
        </div>
        <p class="sr-only" id="pin-live" aria-live="polite" aria-atomic="true"></p>
        <p class="pin-message" id="pin-message" role="alert" hidden></p>
      </div>

      <!-- 3 · The pad: a strict 3-column grid, 1-9 then [C][0][⌫] — the
             phone/POS layout everybody already knows by muscle memory.
             dir="ltr" so 1 sits top-LEFT even inside this RTL page; a
             mirrored keypad is the single fastest way to make staff mistype.
             Real <button>s, ≥56px, so it is tabbable and glove-friendly. -->
      <div class="pin-pad" id="pin-pad" dir="ltr" role="group" aria-label="لوحة أرقام رمز الدخول"></div>

      <button type="submit" class="login-submit" id="login-submit">
        <i class="bi bi-box-arrow-in-left me-1" aria-hidden="true"></i> تسجيل الدخول
      </button>
    </form>

    <!-- رسالة إعداد قابلة للتنفيذ: تظهر فقط عندما ترفض القواعد القراءة
         (تم نشر القواعد المشدّدة) ولم يُفعّل Email/Password بعد، أو في
         حالة المزرعة الفارغة (تهيئة أولى). لا تُستخدم أبدًا كخطأ عام. -->
    <div class="setup-notice" id="setup-notice" role="status" hidden></div>

    <p class="login-trust"><i class="bi bi-shield-lock me-1" aria-hidden="true"></i>لا تُعرض أسماء أو أدوار قبل التحقق من الرمز</p>
  </main>

  <p class="login-hint">
    <i class="bi bi-keyboard me-1" aria-hidden="true"></i>
    لوحة المفاتيح: الأرقام مباشرة · Backspace للحذف · Esc للمسح · Enter للدخول
  </p>
</div>
<div id="toast-wrap"></div>
<script src="config.js"></script>
<script src="firebase.js"></script>
<script src="ui-shell.js"></script>
<!-- O-09: the offline/PWA registrar. Loaded on every page; registration
     itself is gated on FARM_CONFIG.enableServiceWorker in config.js. -->
<script src="sw-register.js" defer></script>
<script>
;(async()=>{
  await Users.init();
  const s=getSettings();
  document.getElementById('farm-name-title').textContent=s.farmName;

  const PIN_LEN=4;
  let lPin='', lUserId='', DIRECTORY=[], FIRST_RUN=false, READ_DENIED=false, BUSY=false;
  let attempts=0, cooldownUntil=0;
  const $=(id)=>document.getElementById(id);
  const GENERIC_FAIL='كود الدخول أو الرمز غير صحيح';   // one message, every failure

  // ── load the identity list (public projection, no hashes) ──────────
  // Read for MATCHING only. Nothing from this array is ever rendered.
  async function loadDirectory(){
    const dir=await fbGetSafe('user_directory');
    const legacy=await fbGetSafe('users');
    if(Array.isArray(dir)&&dir.length){
      DIRECTORY=dir.map(publicUserProjection).filter(Boolean);
    }else if(Array.isArray(legacy)&&legacy.length){
      DIRECTORY=legacy.map(publicUserProjection).filter(Boolean);
    }else{
      DIRECTORY=[];
    }
    FIRST_RUN=(dir===null||!dir.length)&&Array.isArray(legacy)&&legacy.length===0;
    READ_DENIED=(legacy===null)&&(dir===null||!dir.length);
  }
  await loadDirectory();

  function showNotice(html){ const n=$('setup-notice'); n.innerHTML=html; n.hidden=false; }
  function hideNotice(){ const n=$('setup-notice'); n.hidden=true; n.innerHTML=''; }

  // ── identifier matching (Arabic-normalised, never displayed) ───────
  function normalizeId(v){
    return String(v||'')
      .replace(/[\u064B-\u0652\u0670\u0640]/g,'')          // diacritics + tatweel
      .replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي')
      .replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/ة/g,'ه')
      .replace(/\s+/g,'').toLowerCase();
  }
  function matchIdentifier(raw){
    const q=normalizeId(raw);
    if(!q) return null;
    const active=DIRECTORY.filter(u=>u.active!==false);
    // exact id, then exact name, then a UNIQUE prefix. An ambiguous prefix
    // resolves to nothing rather than guessing — and the caller shows the
    // same generic error either way, so neither answer leaks which codes
    // exist.
    return active.find(u=>normalizeId(u.id)===q)
        || active.find(u=>normalizeId(u.name)===q)
        || (function(){
             const p=active.filter(u=>normalizeId(u.name).startsWith(q)||normalizeId(u.id).startsWith(q));
             return p.length===1?p[0]:null;
           })();
  }

  // ── the pad: 3 columns × 4 rows, phone order, [C][0][⌫] last row ───
  const PAD_KEYS=[
    {k:'1'},{k:'2'},{k:'3'},
    {k:'4'},{k:'5'},{k:'6'},
    {k:'7'},{k:'8'},{k:'9'},
    {k:'C',label:'مسح الرمز كله',icon:'bi-x-circle'},
    {k:'0'},
    {k:'⌫',label:'حذف آخر رقم',icon:'bi-backspace'},
  ];
  $('pin-pad').innerHTML=PAD_KEYS.map(x=>{
    const inner = x.icon
      ? `<i class="bi ${x.icon}" aria-hidden="true"></i>`
      : `<span class="pin-key__digit">${x.k}</span>`;
    const aria  = x.label ? ` aria-label="${x.label}"` : '';
    const cls   = x.icon ? ' pin-key--fn' : '';
    return `<button type="button" class="pin-key${cls}" data-key="${x.k}"${aria}>${inner}</button>`;
  }).join('');
  $('pin-pad').querySelectorAll('.pin-key').forEach(b=>{
    b.addEventListener('click',()=>window.pinPress(b.dataset.key));
  });

  // ── dot display + screen-reader progress ───────────────────────────
  function renderPin(message){
    const dots=$('pin-dots').querySelectorAll('.pin-dot');
    dots.forEach((d,i)=>d.classList.toggle('is-on', i<lPin.length));
    const AR=['٠','١','٢','٣','٤'];
    $('pin-live').textContent = lPin.length
      ? `أدخلت ${AR[lPin.length]} من ${AR[PIN_LEN]} أرقام`
      : 'لم تُدخل أرقامًا بعد';
    const m=$('pin-message');
    if(message){ m.textContent=message; m.hidden=false; }
    else { m.textContent=''; m.hidden=true; }
  }
  function shake(){
    const card=$('login-card');
    card.classList.remove('is-shaking');
    void card.offsetWidth;                 // restart the animation
    card.classList.add('is-shaking');
    setTimeout(()=>card.classList.remove('is-shaking'),420);
  }

  window.pinPress=function(k){
    if(BUSY) return;
    if(Date.now()<cooldownUntil){
      renderPin('محاولات كثيرة — انتظر '+Math.ceil((cooldownUntil-Date.now())/1000)+' ثانية');
      return;
    }
    if(k==='⌫'){ lPin=lPin.slice(0,-1); }
    else if(k==='C'){ lPin=''; }
    else if(/^\d$/.test(k) && lPin.length<PIN_LEN){ lPin+=k; }
    else return;
    hideNotice();
    renderPin();
    if(lPin.length===PIN_LEN) attemptLogin();   // 4 digits is the whole credential
  };

  function fail(message){
    lPin=''; BUSY=false;
    attempts++;
    // Client-side friction only: the real limits are the rules and Firebase
    // Auth's own rate limiting. This exists so a shared tablet in a barn does
    // not let somebody hammer the pad all afternoon.
    if(attempts>=5){ cooldownUntil=Date.now()+30000; attempts=0; }
    renderPin(message||GENERIC_FAIL);
    shake();
    setTimeout(()=>{ if(!BUSY) renderPin(); },2200);
  }

  // ── the login itself ──────────────────────────────────────────────
  // Order matters. Firebase Auth is asked FIRST because it is the only
  // verifier that does not require this page to read a stored hash — and
  // reading hashes is exactly what the hardened rules (O-18) forbid. The
  // legacy hash path is a migration fallback that only runs when Firebase
  // cannot answer at all: provider not enabled yet, account not provisioned
  // yet, or no network. A WRONG PIN against a provisioned account is a
  // real failure and never falls through (F-29).
  async function attemptLogin(){
    if(BUSY) return;
    if(Date.now()<cooldownUntil){
      renderPin('محاولات كثيرة — انتظر '+Math.ceil((cooldownUntil-Date.now())/1000)+' ثانية');
      return;
    }
    const typed=$('login-id').value.trim();
    if(!typed){
      $('login-id').focus();
      renderPin('أدخل كود الدخول أولًا');
      return;
    }
    if(lPin.length<PIN_LEN){ $('pin-pad').querySelector('.pin-key').focus(); return; }

    BUSY=true;
    hideNotice();
    renderPin('جارٍ التحقق…');
    $('login-submit').disabled=true;

    const hit=matchIdentifier(typed);
    // FIRST_RUN: a genuinely EMPTY database (fbGetSafe distinguished "empty"
    // from "failed") is the only case where the factory credential is
    // honoured — and it does not need an identifier, because there is nobody
    // to identify.
    lUserId = hit ? hit.id : (FIRST_RUN ? 'admin1' : '');

    if(!lUserId){
      // Uniform delay: a "no such user" answer must not come back faster
      // than a "wrong PIN" answer, or the timing itself enumerates accounts.
      await new Promise(r=>setTimeout(r,420));
      $('login-submit').disabled=false;
      return fail(GENERIC_FAIL);
    }

    const profile=hit||{id:lUserId,role:'admin',name:lUserId};
    let user=null, verifiedBy=null;

    // The user's OWN record. Under the hardened rules a signed-in bridge
    // identity may read exactly this one record (and an admin may read any),
    // so this succeeds for the person logging in and is denied for an
    // anonymous visitor — which is the whole point of O-18.
    let rec=null;
    try{ rec=await fbGetOne('users', lUserId); }catch(e){ rec=null; }

    // 1 · Firebase Auth — verified on Firebase's own servers, no hash read.
    let bridge=null;
    try{ bridge=await signInBestSlot(lUserId, lPin, rec); }catch(e){ bridge=null; }

    if(bridge&&bridge.ok){
      verifiedBy='firebase-auth';
      user={...(rec||profile), active:true};
    }else{
      const reason=bridge?bridge.reason:'network';
      if(reason==='invalid-credentials' && !rec){
        $('login-submit').disabled=false; return fail(GENERIC_FAIL);
      }

      // 2 · Stored-hash verification. Reached when (a) the Email/Password
      //    provider is not enabled yet, (b) no slot has been provisioned for
      //    this user yet, (c) there is no network to Firebase Auth, or
      //    (d) Firebase rejected a PIN the hash says is correct — an admin
      //    rotated it after the slot was created. Provisioning a fresh slot
      //    below is what self-heals case (d).
      const v = rec ? await verifyPinAgainstRecord(rec, lPin) : null;
      if(v && v.ok){
        verifiedBy='pin-hash:'+v.scheme;
        user={...rec, active:rec.active!==false};
        if(v.scheme!=='v2'){
          const v2=await hashPinV2(lPin, lUserId);
          if(v2){
            try{ await fbPut('pin_vault', lUserId, {pin_hash_v2:v2}); }catch(e){}
            try{ await fbPatch('users', lUserId, {pin_hash_v2:v2, pin:null}); }catch(e){}
            user.pin_hash_v2=v2; delete user.pin;
          }
        }
        try{ await provisionAuthSlot(lUserId, lPin, rec); }catch(e){}
      }else if(FIRST_RUN && lPin==='1234'){
        user={id:'admin1',name:'مدير المزرعة',role:'admin',active:true,created:todayStr()};
        verifiedBy='first-run';
        try{ await signInWithFirebaseAuth('admin1','1234',{provision:true}); }catch(e){}
      }else if(!rec && (READ_DENIED||isPermissionDenied())){
        $('login-submit').disabled=false;
        showNotice(
          '<strong><i class="bi bi-shield-lock me-1"></i>يلزم إجراء إعداد واحد</strong>'+
          '<p class="mb-1">قواعد الأمان الجديدة تمنع المتصفح من قراءة رموز الدخول (وهذا مقصود)، '+
          'وتسجيل الدخول أصبح يتم عبر Firebase Authentication.</p>'+
          '<ol class="mb-1"><li>افتح Firebase Console ‏→ Authentication ‏→ Sign-in method</li>'+
          '<li>فعّل <b>Email/Password</b></li>'+
          '<li>ثم نفّذ <code>firebase deploy --only database</code></li></ol>'+
          '<p class="mb-0 small">الترتيب مهم: فعّل المزوّد أولًا، ثم انشر القواعد.</p>');
        return fail('إعداد مطلوب');
      }else{
        $('login-submit').disabled=false; return fail(GENERIC_FAIL);
      }
    }

    if(!user){ $('login-submit').disabled=false; return fail(GENERIC_FAIL); }

    attempts=0;
    setUser({...user, verifiedBy});
    try{ await syncUserDirectory(user); }catch(e){}
    // Audit + login notification (one activity_log row per login — the
    // duplicate write found in the 2026-10 audit stays fixed).
    if(initFirebase()){
      try{
        const _lastLoginKey='_last_login_log_'+user.id;
        const _lastT=+localStorage.getItem(_lastLoginKey)||0;
        const _now=Date.now();
        if(_now-_lastT>300000){  // 5 minutes
          localStorage.setItem(_lastLoginKey,_now);
          await fbPost('login_notifications',{
            userName:user.name, userRole:user.role,
            roleLabel:(typeof ROLES!=='undefined'&&ROLES[user.role])?ROLES[user.role].label:user.role,
            timestamp:new Date().toISOString(),
            date:todayStr(),
            pushed:false
          });
        }
        await fbPost('activity_log',{
          userId:user.id, userName:user.name, userRole:user.role,
          action:'login', resource:'system',
          description:'تسجيل دخول — '+user.name+' ('+((typeof ROLES!=='undefined'&&ROLES[user.role])?ROLES[user.role].label:user.role)+')',
          date:todayStr(),
          timestamp:new Date().toISOString()
        });
      }catch(e){console.warn('login log:',e);}
    }
    window.location.href='dashboard.html';
    BUSY=false;
  }

  $('login-form').addEventListener('submit',(e)=>{ e.preventDefault(); attemptLogin(); });

  if(FIRST_RUN){
    showNotice('<strong><i class="bi bi-stars me-1"></i>تهيئة المزرعة لأول مرة</strong>'+
      '<p class="mb-0">لا توجد حسابات بعد. اكتب أي كود دخول (مثل <code>admin</code>) '+
      'ثم الرمز <code>1234</code> لإنشاء حساب المدير، وغيّره فورًا من صفحة المستخدمين.</p>');
  }

  // ── keyboard: digits anywhere, Backspace/Delete, Esc clears, Enter submits ──
  document.addEventListener('keydown',function(e){
    const inField = e.target && e.target.id === 'login-id';
    if(e.key==='Escape'){ lPin=''; renderPin(); e.preventDefault(); return; }
    if(e.key==='Enter'){ if(!BUSY) attemptLogin(); return; }
    if(inField) return;                        // let the field take its own typing
    if(e.key>='0'&&e.key<='9'){ window.pinPress(e.key); }
    else if(e.key==='Backspace'||e.key==='Delete'){ window.pinPress('⌫'); e.preventDefault(); }
  });

  // Register logout activity before leaving
  window.addEventListener('beforeunload',()=>{
    const u=getUser();
    if(u&&initFirebase()){
      const data={userId:u.id,userName:u.name,userRole:u.role,action:'logout',resource:'system',description:'تسجيل خروج',date:todayStr(),timestamp:new Date().toISOString(),created_at:new Date().toISOString()};
      navigator.sendBeacon(`${FB_URL}/activity_log.json`,JSON.stringify(data));
    }
  });

  renderPin();
  $('login-id').focus();
})();
</script>
</body>
</html>
