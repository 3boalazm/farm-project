name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install test dependencies
        # jsdom powers the unit layer (tests/unit) — it boots the real
        # application scripts against an in-memory Firebase, so the domain
        # modules are tested without a browser binary.
        run: npm install @playwright/test@1.56.0 jsdom@30 --no-save

      - name: Syntax check (all JS)
        run: |
          for f in $(find . -name "*.js" -not -path "./node_modules/*" -not -path "./farm-apk/*" -not -path "./tests/*"); do
            node --check "$f" || exit 1
          done

      - name: Static safety scan (permission + SSOT regression detection)
        run: node scripts/safety-scan.js

      # Runs BEFORE the browser layer on purpose: it needs no browser download,
      # takes ~4s, and covers the domain engines module by module (accounting,
      # weight/birth SSOT, permissions, inventory, alerts, analytics, render
      # helpers, repository invariants). If this is red, the rest is noise.
      - name: Unit layer (module-by-module, jsdom + in-memory Firebase)
        run: npm run test:unit
        env:
          FARM_TZ: Africa/Cairo

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # No manual `python3 -m http.server` + `npx wait-on` step any more:
      # playwright.config.js already declares a webServer that starts the
      # static server and waits for it. The old pair added two independent
      # failure points (an uninstalled wait-on fetched on the fly, and a
      # backgrounded shell process) for something the config already does.
      - name: Run browser regression suite
        run: npx playwright test
        env:
          BASE_URL: http://localhost:8080

      # Failures are published as ANNOTATIONS on purpose: GitHub's log and
      # artifact endpoints are unreachable from some debugging environments
      # (both fail with EOF), while `gh run view` / the check-runs API always
      # show annotations. Without this step a red browser suite is a 400-test
      # mystery; with it, every failing test is named with file:line and the
      # first lines of its error.
      - name: Publish browser failures as annotations
        if: always()
        run: node scripts/report-playwright-failures.js test-results/results.json

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # ── O-12: the emulator rules suite had NEVER been executed ────────────────
  # tests/rules/accounting-rules.test.js is a real @firebase/rules-unit-testing
  # suite. Its own header records that no environment ever had Java, so it was
  # written, committed and never run — untested code pretending to be evidence.
  # GitHub's ubuntu runners do have Java, so this job finally executes it.
  #
  # It is ADVISORY (continue-on-error) on purpose: those expectations were
  # written against the pre-hardening rules, and the 2026-10 access policy in
  # scripts/apply-access-policy.js deliberately reverses them (26 collections
  # used to be readable by any anonymous caller). Promoting this job to
  # blocking means updating its expectations to the policy table in
  # docs/deployment/RULES-AND-DEPLOY.md §2 — never weakening a rule to match
  # an old test. Read its log; do not gate on it yet.
  rules-emulator:
    name: Firebase rules (emulator, advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java (the RTDB emulator is a JVM process)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install the CLI and the rules tester
        run: npm install --no-save firebase-tools@13 @firebase/rules-unit-testing@4

      # `demo-*` project ids put the CLI in offline demo mode: no credentials,
      # no network path to a real project. firebase.json (added 2026-10) points
      # the emulator at the real database.rules.json.
      - name: Run the rules suite against the RTDB emulator
        # `npm install --no-save firebase-tools` puts the CLI in
        # node_modules/.bin, not on PATH — calling `firebase` bare exits 127
        # (which is exactly what the first run of this job did).
        run: >-
          npx --no-install firebase emulators:exec --only database
          --project demo-bayan-farm-rules-test
          "node tests/rules/accounting-rules.test.js"
        env:
          FIREBASE_DATABASE_EMULATOR_HOST: 127.0.0.1:9000

      - name: Summarise
        if: always()
        run: >-
          echo "Advisory job: see docs/deployment/RULES-AND-DEPLOY.md §4 for why
          this is not (yet) a blocking gate."

# Failure conditions (any step failing red-lines the whole gate):
#   - permission regression (safety-scan.js exits 1)
#   - SSOT regression (safety-scan.js exits 1, or a tests/ssot/* spec fails)
#   - syntax errors (node --check)
#   - any unit-layer failure (npm run test:unit)
#   - any browser regression suite failure
#
# NOTE (2026-10 audit): this gate was RED on every one of the last 8 runs on
# main before this commit — Playwright was collecting tests/rules/*.test.js
# (an emulator-only Node script whose dependency is not installed), dying
# during collection, and running zero tests. See playwright.config.js's
# testIgnore and docs/audit/FULL-AUDIT-2026-10.md.
